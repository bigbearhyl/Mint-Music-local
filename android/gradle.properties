org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=false
# Let Flutter's own Gradle plugin emit per-ABI release APKs when Android
# Studio runs assembleRelease, instead of one universal APK with all native
# Flutter and plugin libraries.
split-per-abi=true
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
android.suppressUnsupportedCompileSdk=36
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
# 老旧第三方插件（on_audio_query_android 等）未显式设置 Kotlin jvmTarget，
# 与 AGP 默认 Java 1.8 不一致，这里是本地构建临时放宽校验（warning 而非 error）
kotlin.jvm.target.validation.mode=ignore
